name: daily-collect

# 수집 스케줄 (schedule은 기본 브랜치에서만 발화, 수동은 workflow_dispatch):
#  - 장중 30분 간격: 09:00~15:30 KST = 00:00~06:30 UTC (시세성 지표 준실시간 갱신)
#  - 마감 확정   : 20:00 KST = 11:00 UTC (전 지표 확정 수집)
# 매 실행마다 collect.py가 11개 지표를 새로 수집한다. 장중엔 시세(지수·주식·환율·WTI)가
# 약 15~20분 지연으로 갱신되고, 금리(ECOS/FRED)·투자자 순매수(Naver)는 일 1회 확정이라
# 장중에는 직전 확정값이 유지되다 마감 수집에서 확정된다.
on:
  schedule:
    - cron: "0,30 0-6 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # data.json 커밋
  pages: write      # Pages 배포
  id-token: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ web/data.json web/history.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 국면 데이터 갱신 [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
